services:
  db:
    image: postgres:16-alpine
    container_name: gqa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gqa
    ports:
      # Eğer local postgres 5432'de çalışıyorsa ve çakışma olursa 5433 yapılabilir
      - "5432:5432"
    volumes:
      - gqa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend
  backend:
    build:
      context: ./backend
    container_name: gqa_backend
    environment:
      # Docker ortamında DB hostname = service adı (db)
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/gqa
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: > # bash -lc yerine sh -c de kullanılabilir, ancak bash daha yaygın
      bash -lc "alembic upgrade head &&
                uvicorn app.main:app --host 0.0.0.0 --port 8000"
                
  # Database Seeder
  seed:
    build:
      context: ./backend
    container_name: gqa_seed
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/gqa
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: >
      bash -lc "alembic upgrade head &&
                python -m app.seed"
    restart: "no"

  # React Frontend
  frontend:
    build:
      context: ./frontend
    container_name: gqa_frontend
    environment:
      # Tarayıcıdan erişildiği için localhost doğru
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  gqa_pgdata:
